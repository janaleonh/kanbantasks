<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planner · Verbesserungen auswählen</title>
<style>*{box-sizing:border-box}body{margin:24px auto;max-width:640px;padding:0 16px;font:16px/1.5 system-ui;color:#202426;background:#faf9f6}h1{font-size:1.6rem}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:700;margin-bottom:6px}label{display:flex;align-items:center;gap:12px;padding:10px;background:white;border-bottom:1px solid #ddd;cursor:pointer}input{width:20px;height:20px;flex-shrink:0}textarea{width:100%;padding:10px;font:inherit}button{background:#305a51;color:white;border:0;border-radius:8px;padding:12px 16px;font:inherit}</style>
<h1>Welche Verbesserungen möchtest du?</h1><main></main><textarea aria-label="Auswahl für den Chat" readonly></textarea><button id="copy">Auswahl für den Chat kopieren</button><span role="status"></span>
<script>
const groups=[['Aufgaben, Suche und Kalender',['Geteilte Aufgabe direkt öffnen','Aufgabe mit einem Tipp öffnen und per Haken erledigen','Fokus direkt bei der gewählten Aufgabe starten','Notizen und Dokumente einem Projekt zuordnen','Suche auf weitere Monate oder NAS-Dateien ausweiten','Terminformular mit einklappbaren Zusatzoptionen','Periodenbeginn und Ende direkt im Monatsraster antippen']],['Notizen, Dokumente und NAS',['Wischlöschen sofort rückgängig machen','Mehr Platz zum Schreiben im Notizeditor','Geteilte Dateien im Dokumenteneingang anzeigen','NAS-Verbindungstest mit Fehlerursache und nächstem Schritt','Gemeinsame Uploadliste für Scans']],['Sicherungen, Widgets und Einstellungen',['Inhalt einer Sicherung vorab anzeigen','Heute-Widget öffnet das passend gefilterte Board','Einstellungen nach häufigen Aktionen ordnen']]];
let n=0;const output=document.querySelector('textarea'),status=document.querySelector('[role=status]');
for(const [name,items] of groups){const group=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=name;group.append(legend);for(const title of items){const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.value=String(++n);label.append(box,n+'. '+title);group.append(label)}document.querySelector('main').append(group)}
function refresh(){const ids=[...document.querySelectorAll('input:checked')].map(x=>x.value);output.value=ids.length?'Bitte umsetzen: '+ids.join(', '):'';document.querySelector('button').disabled=!ids.length;status.textContent=''}
document.addEventListener('change',refresh);refresh();
document.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(output.value);status.textContent=' Kopiert.'}catch{output.focus();output.select();status.textContent=' Auswahl markiert – bitte kopieren.'}};
</script></html>
