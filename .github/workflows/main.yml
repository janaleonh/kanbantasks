name: Build Unsigned iOS IPA (Sideloadly / AltStore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Build iOS .ipa on macOS
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select newest stable Xcode on runner
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app
          CHOSEN=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Using Xcode: $CHOSEN"
          sudo xcode-select -s "$CHOSEN"
          xcodebuild -version
          swift --version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Patch expo-modules-jsi for Swift 6.2 (Xcode 26.3 compatibility)
        run: |
          python3 - << 'EOF'
          import re

          base = "node_modules/expo-modules-jsi/apple"

          # 1) Package.swift: use Swift 5 language mode, disable upcoming strict isolation features,
          #    and remove -Werror flags so warnings don't abort compilation.
          p = base + "/Package.swift"
          t = open(p).read()
          t = t.replace("swiftLanguageModes: [.v6]", "swiftLanguageModes: [.v5]")
          t = t.replace('.enableUpcomingFeature("NonisolatedNonsendingByDefault"),', "")
          t = t.replace('.enableUpcomingFeature("InferIsolatedConformances"),', "")
          t = re.sub(r'\s*"-Werror",\s*"[A-Za-z]+",', "", t)
          open(p, "w").write(t)
          assert ".v5" in t, "Package.swift patch failed"

          # 2) JavaScriptObject.swift: wrap slot pointer in UncheckedSendable
          p = base + "/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift"
          t = open(p).read()
          t = t.replace(
              "nonisolated(unsafe) let slot = buffer.baseAddress!",
              "nonisolated(unsafe) let slot = buffer.baseAddress!\n    let sendableSlot = UncheckedSendable(slot)",
          )
          t = t.replace(
              "try encode(JavaScriptValue.Slot(slot), runtime)",
              "try encode(JavaScriptValue.Slot(sendableSlot.value), runtime)",
          )
          open(p, "w").write(t)
          assert "sendableSlot.value" in t, "JavaScriptObject.swift patch failed"

          # 3) JavaScriptFunction.swift: wrap arguments and result pointers in UncheckedSendable
          p = base + "/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptFunction.swift"
          t = open(p).read()
          old_fn = """      nonisolated(unsafe) let arguments = storage.baseAddress!
      nonisolated(unsafe) let result = arguments + argumentCount
      for index in 0...argumentCount {
        expo.emplaceUndefined(arguments + index)
      }
      defer {
        expo.destroyValues(arguments, argumentCount + 1)
      }
      try JavaScriptActor.assumeIsolated {
        try emplacing(JavaScriptValuesBuffer(runtime, start: arguments, count: argumentCount), runtime)
      }
      try throwCppErrorUnlessSucceeded(
        expo.callFunctionInto(runtime.pointee, pointee, arguments, argumentCount, result)
      )
      try JavaScriptActor.assumeIsolated {
        try withResult(JavaScriptUnownedValue(runtime.pointee, result), runtime)
      }"""
          new_fn = """      let arguments = UncheckedSendable(storage.baseAddress!)
      let result = UncheckedSendable(arguments.value + argumentCount)
      for index in 0...argumentCount {
        expo.emplaceUndefined(arguments.value + index)
      }
      defer {
        expo.destroyValues(arguments.value, argumentCount + 1)
      }
      try JavaScriptActor.assumeIsolated {
        try emplacing(JavaScriptValuesBuffer(runtime, start: arguments.value, count: argumentCount), runtime)
      }
      try throwCppErrorUnlessSucceeded(
        expo.callFunctionInto(runtime.pointee, pointee, arguments.value, argumentCount, result.value)
      )
      try JavaScriptActor.assumeIsolated {
        try withResult(JavaScriptUnownedValue(runtime.pointee, result.value), runtime)
      }"""
          assert old_fn in t, "JavaScriptFunction.swift target not found"
          t = t.replace(old_fn, new_fn)
          open(p, "w").write(t)

          # 4) JavaScriptValuesBuffer.swift: wrap start pointer in UncheckedSendable
          p = base + "/Sources/ExpoModulesJSI/Runtime/JavaScriptValuesBuffer.swift"
          t = open(p).read()
          old_buf = """      let start = storage.baseAddress
      if let start {
        for index in 0..<count {
          expo.emplaceUndefined(start + index)
        }
      }
      defer {
        if let start {
          expo.destroyValues(start, count)
        }
      }
      let buffer = JavaScriptValuesBuffer(runtime, start: start, count: count)
      try JavaScriptActor.assumeIsolated {
        try emplaceValues(buffer, runtime)
      }
      return try body(buffer)"""
          new_buf = """      let start = UncheckedSendable(storage.baseAddress)
      if let ptr = start.value {
        for index in 0..<count {
          expo.emplaceUndefined(ptr + index)
        }
      }
      defer {
        if let ptr = start.value {
          expo.destroyValues(ptr, count)
        }
      }
      try JavaScriptActor.assumeIsolated {
        try emplaceValues(JavaScriptValuesBuffer(runtime, start: start.value, count: count), runtime)
      }
      return try body(JavaScriptValuesBuffer(runtime, start: start.value, count: count))"""
          assert old_buf in t, "JavaScriptValuesBuffer.swift target not found"
          t = t.replace(old_buf, new_buf)
          open(p, "w").write(t)

          # 5) build-xcframework.sh: remove -quiet so any compiler output is visible immediately
          p = base + "/scripts/build-xcframework.sh"
          t = open(p).read()
          t = t.replace("    -quiet \\\n", "")
          open(p, "w").write(t)

          print("All ExpoModulesJSI patches applied successfully!")
          EOF

      - name: Generate Native iOS Project (Expo Prebuild)
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Disable Code Signing in Podfile & Install Pods
        run: |
          cd ios
          python3 - << 'EOF'
          p = open("Podfile").read()
          patch = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGN_IDENTITY"] = ""
                config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
              end
            end
          """
          p = p.replace("post_install do |installer|", "post_install do |installer|\n" + patch)
          open("Podfile", "w").write(p)
          EOF
          pod install

      - name: Prebuild ExpoModulesJSI.xcframework (isolated step with clear log)
        run: |
          export PODS_ROOT="$PWD/ios/Pods"
          export PLATFORM_NAME="iphoneos"
          bash node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh

      - name: Build Unsigned Release .app via Xcode
        run: |
          set -o pipefail
          export NODE_BINARY=$(which node)
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Show real compiler errors (open this step if build failed)
        if: failure()
        run: |
          {
            echo "## Xcode error summary (short)"
            echo '```'
            echo "--- compiler / script errors ---"
            grep -nE "error:|: error |fatal error|did not produce|No such module|cannot find|\*\* BUILD FAILED|failed with exit code" ios/xcodebuild.log | cut -c1-400 | head -n 40 || true
            echo
            echo "--- Last 80 lines of xcodebuild.log ---"
            tail -n 80 ios/xcodebuild.log | cut -c1-400 || true
            echo '```'
          } > error-summary.txt
          cat error-summary.txt
          cat error-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-error-log
          path: ios/xcodebuild.log

      - name: Package .app into KanbanTasks.ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r9 KanbanTasks.ipa Payload

      - name: Upload KanbanTasks.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanTasks-unsigned-ipa
          path: KanbanTasks.ipa
          retention-days: 30
