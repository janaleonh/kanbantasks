name: Build Unsigned iOS IPA (Sideloadly / AltStore)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Build iOS .ipa on macOS
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select newest stable Xcode on runner
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app
          CHOSEN=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -n 1)
          echo "Using Xcode: $CHOSEN"
          sudo xcode-select -s "$CHOSEN"
          xcodebuild -version
          swift --version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Patch expo-modules-jsi for Swift 6.2 (no strict concurrency errors)
        run: |
          python3 - << 'EOF'
          import re, sys

          base = "node_modules/expo-modules-jsi/apple"

          # 1) Package.swift: Swift 5 language mode (data-race "sending" diagnostics are not errors there)
          #    and drop the -Werror flags, which only make newer compilers fail on harmless warnings.
          p = base + "/Package.swift"
          t = open(p).read()
          t = t.replace("swiftLanguageModes: [.v6]", "swiftLanguageModes: [.v5]")
          t = re.sub(r'\s*"-Werror",\s*"[A-Za-z]+",', "", t)
          open(p, "w").write(t)
          assert ".v5" in t, "Package.swift patch failed"

          # 2) JavaScriptObject.swift: wrap pointer in UncheckedSendable
          p = base + "/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift"
          t = open(p).read()
          t = t.replace(
              "nonisolated(unsafe) let slot = buffer.baseAddress!",
              "nonisolated(unsafe) let slot = buffer.baseAddress!\n    let sendableSlot = UncheckedSendable(slot)",
          )
          t = t.replace(
              "try encode(JavaScriptValue.Slot(slot), runtime)",
              "try encode(JavaScriptValue.Slot(sendableSlot.value), runtime)",
          )
          open(p, "w").write(t)
          assert "sendableSlot.value" in t, "JavaScriptObject patch failed"

          print("Patches applied OK")
          EOF
          echo "---- Package.swift (flags) ----"
          grep -n "swiftLanguageModes\|Werror" node_modules/expo-modules-jsi/apple/Package.swift || true

      - name: Generate Native iOS Project (Expo Prebuild)
        env:
          CI: "1"
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Disable Code Signing in Podfile & Install Pods
        run: |
          cd ios
          python3 - << 'EOF'
          p = open("Podfile").read()
          patch = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings["CODE_SIGNING_ALLOWED"] = "NO"
                config.build_settings["CODE_SIGNING_REQUIRED"] = "NO"
                config.build_settings["CODE_SIGN_IDENTITY"] = ""
                config.build_settings["EXPANDED_CODE_SIGN_IDENTITY"] = ""
              end
            end
          """
          p = p.replace("post_install do |installer|", "post_install do |installer|\n" + patch)
          open("Podfile", "w").write(p)
          EOF
          pod install

      - name: Build Unsigned Release .app via Xcode
        run: |
          set -o pipefail
          export NODE_BINARY=$(which node)
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Show real compiler errors (open this step if build failed)
        if: failure()
        run: |
          {
            echo "## Xcode error summary"
            echo '```'
            echo "--- error lines ---"
            grep -n "error" ios/xcodebuild.log | grep -v "^.*note:" | head -n 60 || true
            echo
            echo "--- ExpoModulesJSI build script output ---"
            awk '/PhaseScriptExecution .*Build.*ExpoModulesJSI/{f=1} f' ios/xcodebuild.log | grep -v "^note:" | head -n 150 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-error-log
          path: ios/xcodebuild.log

      - name: Package .app into KanbanTasks.ipa
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r9 KanbanTasks.ipa Payload

      - name: Upload KanbanTasks.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KanbanTasks-unsigned-ipa
          path: KanbanTasks.ipa
          retention-days: 30
